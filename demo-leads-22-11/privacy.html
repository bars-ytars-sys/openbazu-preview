<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Данные в демо</title><link rel="stylesheet" href="assets/leads.css"></head><body class="ld-overview"><main class="ld-overview__main"><div class="ld-overview__intro"><p class="ld-eyebrow">Демонстрация</p><h1>Ваши данные в демо</h1><p>Контакты из форм не отправляются и не сохраняются. Выбранные файлы остаются на вашем устройстве. Подборка домов хранится только в текущей сессии браузера. Это копия для просмотра новых сценариев, оформление услуг и покупок здесь отключено.</p><a class="ld-button" href="start.html" style="margin-top:25px">К обзору демо</a></div></main></body></html>
